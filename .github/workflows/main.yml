name: Render Video
on: [workflow_dispatch]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./video
        run: npm install
      - name: Render video
        working-directory: ./video
        run: npx remotion render src/index.tsx MoustacheProof out/video.mp4 --public-dir=../public
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: video/out/video.mp4
